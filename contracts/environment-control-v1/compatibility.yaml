# Environment Control contract v1 — frozen compatibility surface.
#
# Spec: feature-specs/2026-08-09-cellrebel-qianwangyou-a-plus.md §6.7.
#
# This file is the machine-readable half of the handshake. A wire code listed
# here is permanent: it is never renumbered, never reused for a different
# meaning, and never removed. New constants may only append a new code, and only
# after passing the skew matrix below.
#
# Enforced by scripts/check-contract-v1.sh, which compares this file against the
# Kotlin sources and fails on any divergence.

protocolVersion: 1
supportedProtocolVersions: [1]

aidl:
  package: io.github.terryyyc.fakexxx.contract.v1
  interface: IEnvironmentControlV1
  methods: [discover, preflight, apply, observe, release, completeAndAdvance]

minSdk: 24   # lower bound of the two consumers: Auto 26, Qianwangyou 24

service:
  className: name.caiyao.fakegps.integration.v1.EnvironmentControlService
  # Two applicationIds, paired independently. The class name is unaffected by
  # the debug applicationIdSuffix.
  applicationIds:
    production: name.caiyao.fakegps
    bench: name.caiyao.fakegps.bench

constants:
  trustedLocationToleranceMeters: 1.0
  canonicalCoordinateScale: 7

enums:
  VerificationLevelV1:
    SYSTEM_MOCK_INDEPENDENTLY_VERIFIED: 1
    HOOK_UNVERIFIED: 2
    NONE: 3
  ContinuityCoverageV1:
    FULL: 1
    PARTIAL: 2
    NONE: 3
  DeliveryModeV1:
    SYSTEM_MOCK: 1
    HOOK: 2
  ScheduleDecisionV1:
    ALLOWED_NOW: 1
    WAIT_UNTIL: 2
    DENIED: 3
  AdvanceOutcomeV1:
    ADVANCED: 1
    EXHAUSTED: 2
  ContractErrorCodeV1:
    NOT_PAIRED: 1
    CALLER_NOT_ALLOWED: 2
    INCOMPATIBLE_PROTOCOL: 3
    CAPABILITY_UNAVAILABLE: 4
    SCHEDULE_DENIED: 5
    CONTINUITY_NOT_FULL: 6
    LEASE_CONFLICT: 7
    STALE_LEASE: 8
    ENVIRONMENT_DRIFT: 9
    RELEASE_INCOMPLETE: 10
    INTERNAL_FAILURE: 11
    IDEMPOTENCY_CONFLICT: 12
    REQUEST_INVALID: 13
    SCHEDULE_ITEM_MISMATCH: 14
    SCHEDULE_VERSION_STALE: 15
    SCHEDULE_EXHAUSTED: 16

# Skew cases. Every row is covered by ContractWireCompatibilityTest.
skew:
  - case: same protocol version, all wire codes known
    peerProtocolVersion: 1
    outcome: run
  - case: new Auto + old provider (provider below the supported set)
    peerProtocolVersion: 0
    outcome: INCOMPATIBLE_PROTOCOL
  - case: old Auto + new provider (provider above the supported set)
    peerProtocolVersion: 2
    outcome: INCOMPATIBLE_PROTOCOL
  - case: supported protocol version but an unknown enum wire code
    peerProtocolVersion: 1
    unknownWireCode: true
    outcome: INCOMPATIBLE_PROTOCOL

# Never permitted in v1, regardless of convenience:
forbidden:
  - Kotlin enum types inside any @Parcelize class (auto-encoded by name; a peer's
    new constant makes an older reader throw from createFromParcel instead of
    failing closed with a typed error)
  - generic command/Map payloads
  - ordinal, >=, or "not NONE" based trust decisions
  - treating an unknown wire code as compatible
