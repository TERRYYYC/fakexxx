name: android-a-plus

# Four independent lanes (three app lanes + acceptance).
#
# `cellrebel-auto` and `qianwangyou` have NO dependency edge between them, by
# design (INV-19): the two apps build, test and release independently, and a
# green result on one must never be read as "the other is releasable". Runtime
# compatibility is decided by the contract handshake, not by a joint build.
#
# Spec: feature-specs/2026-08-09-cellrebel-qianwangyou-a-plus.md §12.1, §14, INV-19.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-a-plus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance:
    # Job id stays `provenance` (no required-check binding moves). The VISIBLE
    # name changed in v1.74 because it was wider than the predicate: at
    # --stage contract this job explicitly ALLOWS the vendored trees to diverge
    # and prints so ("has diverged from upstream (allowed at stage contract)",
    # "does not bound WHICH paths diverged"). A green check literally named
    # "trees == upstream SHAs" therefore asserted, to anyone reading the checks
    # list, something the gate had stopped proving.
    name: provenance (frozen upstream roots + reachable ancestry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the gate verifies that the import commit
          # recorded in docs/provenance/upstream-imports.md exists and carries
          # the upstream tree. A depth-1 checkout does not contain it.
          fetch-depth: 0

      - name: check-provenance
        # --stage is required and has no default (see the script header). At
        # PR-1 the vendored apps must still be pristine, so that branch ran the
        # strict stage, and its comment said this line is what moves when a
        # later PR legitimately changes an app.
        #
        # THIS IS THAT PR. Wiring the contract module into both app Gradle roots
        # is the first legitimate divergence: 7 app build files, +34 lines, all
        # of it `include`/`implementation`/`<queries>` plumbing and no upstream
        # source touched. Measured on this exact tree:
        #
        #   --stage import   -> rc=1  (2 checks failed: HEAD tree != upstream)
        #   --stage contract -> rc=0
        #   --stage full     -> rc=0
        #
        # The move is designed, and it IS a narrowing -- calling it "not a
        # weakening" (as this comment did until v1.74) overstated what survives.
        # What this job proves at --stage contract, exactly:
        #   1. the upstream SHA / root tree frozen in the provenance doc matches
        #      the real upstream objects;
        #   2. a REACHABLE ancestor of HEAD carried that pristine root tree;
        #   3. each working tree equals its current HEAD.
        # What it no longer proves: that the current tree is byte-identical to
        # upstream (retired on purpose, it is false now), and -- the part the old
        # wording hid -- it does NOT bound WHICH paths may diverge. Bounding the
        # diverged path set is the scope gate's job, not this one. (The import
        # *commit* is not the anchor — a squash/rebase merge legitimately
        # discards it, so it is asserted only while still reachable.)
        run: ./scripts/check-provenance.sh --stage contract

      - name: selftest-provenance
        # The negative matrix is a regression gate, not a table in a document.
        # It runs the production check-provenance.sh (never a copy) against
        # throwaway clones, so a negative can only start passing if the real
        # predicate changed. Several of these were shipped defects a reviewer had
        # to find by hand. It also mutation-checks itself: reverting a fix must
        # make the case guarding it fail, otherwise that case proves nothing.
        run: ./scripts/selftest-provenance.sh

  contract-v1:
    # Verifies the frozen contract from BOTH app Gradle roots, which is the
    # point: a shared library that only compiles inside one consumer's build is
    # not shared. Deliberately not a dependency of either app job.
    name: contract-v1 (static guards + both roots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle wrappers are executable
        run: chmod +x apps/cellrebel-auto/gradlew apps/qianwangyou/gradlew

      - name: check-contract-v1
        run: ./scripts/check-contract-v1.sh

      - name: selftest-contract-v1
        # check-contract-v1.sh being green says something only while it is still
        # sensitive to the drift it claims to catch, and nothing measured that:
        # the mutation proofs behind its guards were one-off scripts run by hand,
        # so a change that quietly weakened one would land on a green board.
        #
        # This runs the PRODUCTION gate against mutated throwaway copies of the
        # canonical spec and asserts each guard reports its OWN finding and
        # nothing else's -- a case that goes red for the wrong reason is a false
        # red, and reads identical here to a true one. The M-* cases then disable
        # one guard at a time and require the matching finding to disappear,
        # which is what distinguishes a load-bearing guard from dead code that a
        # broader older check happens to cover for.
        run: ./scripts/selftest-contract-v1.sh

      - name: check-derived-counts
        # Every count in prose (§15 lane selectors, §16 task scopes, the
        # aggregation and class-responsibility tables) is a CACHE of a number
        # derived from the §10.1 ledger. Keeping those caches in sync by hand
        # has now failed four times: v1.38 synced the ledger and left the lane
        # selector table; v1.39 fixed the lane selector table and left two
        # others twenty lines away, while claiming it had fixed all four; v1.46
        # recomputed 29 cache points by hand and still shipped one stale number,
        # and that miss was a SECOND stale number later in a line already edited
        # in the same pass -- the exact failure mode that commit's own message
        # named.
        #
        # v1.46 responded by FREEZING the rule "derived counts may only be
        # computed from the §10.1 ledger" and enforcing it with nothing. This
        # step is the enforcement. It recomputes the ledger truth and fails when
        # active prose states a count the ledger cannot produce.
        run: ./scripts/check-derived-counts.sh

      - name: selftest-derived-counts
        # The same argument the selftest-contract-v1 step above makes, applied to
        # the guard directly beneath it -- with one extra reason it could not be
        # wired until now.
        #
        # check-derived-counts.sh shipped green for rounds while four notations
        # of real cache sites sat in its blind spot, which is a PASS measured in
        # the units of its own recognition. 6cfea07 widened it into five named
        # arms and built this harness to prove each arm is load-bearing, but did
        # not wire it: the harness's positive case was deliberately inverted to
        # assert RED while the 15 newly-visible stale caches were still awaiting
        # the mainline recompute, so wiring it then would have pinned CI to a
        # defect. v1.60 landed that recompute and flipped the positive case to
        # assert green, which is what makes this step meaningful rather than a
        # second way to report the same red.
        #
        # A selftest that exists but never runs is not a guard. That is the same
        # shape as KB-7's "registration is not transport": the artifact was
        # present, the property it claimed was never actually carried.
        run: ./scripts/selftest-derived-counts.sh

  cellrebel-auto:
    # Green here covers apps/cellrebel-auto ONLY.
    name: cellrebel-auto (unit + lint + assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cellrebel-auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: assemble
        run: ./gradlew --no-daemon assembleDebug

      # P10 (G2 §3 P10): the fault/revoke collector is debug-only by hard
      # constraint — the release variant must not carry it. Building release
      # and byte-scanning the dex pool is the artifact half of that proof;
      # source placement alone is necessary, not sufficient.
      - name: release build (P10 purity gate)
        run: ./gradlew --no-daemon assembleRelease

      - name: debug-only collector purity (P10)
        working-directory: .
        run: |
          ./scripts/check-debug-only-collector.sh apps/cellrebel-auto/app \
            --apk apps/cellrebel-auto/app/build/outputs/apk/release/app-release-unsigned.apk

      # Lint runs through the debt ratchet rather than as `lintDebug`, so a
      # green check never hides a growing error count. Budget for this app is 0.
      - name: lint debt ratchet
        working-directory: .
        run: ./scripts/check-inherited-lint-debt.sh cellrebel-auto

      - name: record apk digest
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          printf 'source HEAD : %s\n' "$GITHUB_SHA"
          printf 'apk sha256  : %s\n' "$(sha256sum "$apk" | cut -d' ' -f1)"

      # F-18: a random runner-rolled debug.keystore once shipped in a downloaded
      # artifact and made the bench device uninstallable-over. The signer is now
      # repo state; this gate proves the artifact actually carries it.
      - name: debug signer pinned to repo keystore (F-18)
        working-directory: .
        run: |
          ./scripts/check-debug-signer.sh \
            apps/cellrebel-auto/keystores/bench.keystore \
            apps/cellrebel-auto/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cellrebel-auto-evidence
          path: |
            apps/cellrebel-auto/app/build/reports/**
            apps/cellrebel-auto/app/build/test-results/**
            apps/cellrebel-auto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  qianwangyou:
    # Green here covers apps/qianwangyou ONLY. No edge to cellrebel-auto.
    name: qianwangyou (unit + lint + assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qianwangyou
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: assemble
        run: ./gradlew --no-daemon assembleDebug

      # P10 (G2 §3 P10): same purity gate as the cellrebel-auto lane — the
      # collector must be absent from the release artifact (byte scan).
      - name: release build (P10 purity gate)
        run: ./gradlew --no-daemon assembleRelease

      - name: debug-only collector purity (P10)
        working-directory: .
        run: |
          ./scripts/check-debug-only-collector.sh apps/qianwangyou/app \
            --apk apps/qianwangyou/app/build/outputs/apk/release/app-release.apk

      # `lintDebug` exits non-zero here: 23 lint errors came in with
      # FakeGps-test@285e4ca, which never had CI. They are frozen, not silenced
      # — this step fails if the count grows. Fixing them is PR-3's disposition.
      - name: lint debt ratchet
        working-directory: .
        run: ./scripts/check-inherited-lint-debt.sh qianwangyou

      - name: record apk digest
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          printf 'source HEAD : %s\n' "$GITHUB_SHA"
          printf 'apk         : %s\n' "$apk"
          printf 'apk sha256  : %s\n' "$(sha256sum "$apk" | cut -d' ' -f1)"

      # F-18: a random runner-rolled debug.keystore once shipped in a downloaded
      # artifact and made the bench device uninstallable-over. The signer is now
      # repo state; this gate proves the artifact actually carries it.
      - name: debug signer pinned to repo keystore (F-18)
        working-directory: .
        run: |
          ./scripts/check-debug-signer.sh \
            apps/qianwangyou/keystores/bench.keystore \
            apps/qianwangyou/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qianwangyou-evidence
          path: |
            apps/qianwangyou/app/build/reports/**
            apps/qianwangyou/app/build/test-results/**
            apps/qianwangyou/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  install-guards:
    # F-18: selftests for the signer gate and the verified-install helpers.
    #
    # The R2 review of PR #44 pinned the invariant this job exists to carry:
    # a selftest that exists but never runs is not a guard (see the same
    # argument at the selftest-derived-counts step). The three scripts below
    # are device-free by construction (fake adb / fake keytool+apksigner PATH
    # shims), so they run on a plain runner in seconds.
    name: install guards (F-18 selftests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: selftest-debug-signer
        run: ./scripts/selftest-debug-signer.sh

      - name: selftest-debug-only-collector
        # P10 (G2 §3): negative matrix for the debug-only collector boundary.
        # A purity guard that cannot fail is decoration — every check the
        # guard makes is exercised against a hand-built violation (leak into
        # src/main, vacuous marker, marker/class bytes in a release APK).
        # Device-free by construction (fixture trees + fixture zips).
        run: ./scripts/selftest-debug-only-collector.sh

      - name: selftest-install-apk-verified
        run: ./scripts/selftest-install-apk-verified.sh

      - name: selftest-test-hook-install-guard
        run: ./scripts/selftest-test-hook-install-guard.sh

      - name: selftest-test-hook-package-identity
        # G2 package §3.3-3: test-hook.sh must prove it drives the .bench
        # acceptance install, never the production package. Red-first cases
        # (R1 install identity, R2 dumpsys gate) demonstrably false-green on
        # the pre-fix script (M1/M2 mutation checks) — the same
        # "runs the production script, never a copy" argument as above.
        run: ./scripts/selftest-test-hook-package-identity.sh

      - name: selftest-test-hook-acceptance-readiness
        # G2 §3.3-3 last sentence / S1 block: without a transaction-free
        # readiness path, an on-device run has no canonical way to prove it
        # starts the REAL .bench acceptance component (the S1 incident shape:
        # criterion weakened to a non-acceptance anchor). N1/N1b/N2/N3 pin
        # the negative matrix; M1/M2 prove the guards load-bearing — a
        # selftest that exists but never runs is not a guard.
        run: ./scripts/selftest-test-hook-acceptance-readiness.sh

      - name: hook-matrix-contract (python payload/verdict suites)
        # PR #62 P1-4: these suites existed but were wired into NO gate, so
        # the matrix tool emitted schemaVersion 3 for a writer contract at 4
        # and every --cellular-matrix scenario would abort on-device before
        # report_ready — §G unexecutable while all checks stayed green. The
        # version pin reads ConfigPrefsSync.SCHEMA_VERSION from source, so a
        # future writer bump red-fails HERE instead of on a device lease.
        run: cd apps/qianwangyou && python3 -m unittest scripts.test_cellular_acceptance_matrix scripts.test_hook_verdict

  row2-exec:
    # G2 Row 2 execution plane (host-side lane of the PR #55 evidence
    # contract): runner + ROW2-EXEC-ACCESS-V2 classifier + executable
    # manifest + execution packet, with the mutation matrix that keeps every
    # guard load-bearing. Device-free by construction — the only executables
    # the launcher ever starts in the gate are sort/cat/grep/bash class host
    # binaries in throwaway evidence roots; adb exists only as classifier
    # grammar. This job is the host precondition Fable's EXECUTABLE verdict
    # and the later device authorization depend on.
    name: row2-exec (gate + mutation matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check-row2-exec
        run: ./scripts/check-row2-exec.sh

      - name: selftest-row2-exec
        # The gate being green carries information only while its guards are
        # still sensitive to the drift they claim to catch (the same argument
        # as selftest-contract-v1). R1-R6 mutate throwaway payload copies —
        # escape allowed / missing carrier quadruple / packet-carrier
        # mismatch / write-budget off-by-one / grammar narrowing / access
        # labels — and M-* disable one arm each to prove load-bearing.
        run: ./scripts/selftest-row2-exec.sh

  release-debt:
    # Gate that proves open contract-v1.1-debt blocks release (Issue #19/#20).
    # Runs the full selftest suite (12 cases) and matrix coverage check (M-AD-14..19).
    # This job is the TRANSPORT for KB-7: "registration is not transport" — without
    # this step, the gate exists but never runs in CI, which is the same as not existing.
    name: release-debt (selftest + matrix coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: selftest-release-debt
        run: ./scripts/selftest-release-debt.sh

      - name: check-matrix-coverage
        run: ./scripts/check-matrix-coverage.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle wrapper is executable
        run: chmod +x apps/cellrebel-auto/gradlew

      - name: advance matrix tests (M_AD_14..19)
        working-directory: apps/cellrebel-auto
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.example.cellrebelauto.matrix.AdvanceMatrixTest"

  acceptance:
    # Independent acceptance harness (#6). Exercises the v1 contract through a
    # fake-qwy provider that shares ZERO code with the production provider.
    # No dependency on cellrebel-auto or qianwangyou jobs — by design (§10.1).
    name: acceptance (matrix tests + static guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acceptance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: matrix tests (sol-blackbox 22 rows)
        run: ./gradlew --no-daemon :scenarios:testDebugUnitTest

      - name: static guard (M-BP-01, M-BP-02)
        working-directory: .
        run: bash acceptance/scripts/check-forbidden-boundaries.sh

      - name: guard self-test (violating samples)
        working-directory: .
        run: bash acceptance/scripts/selftest/run-guard-selftest.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            acceptance/scenarios/build/reports/**
            acceptance/scenarios/build/test-results/**
            acceptance/build/matrix-evidence-guard.json
          if-no-files-found: warn
