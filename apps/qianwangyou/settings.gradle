pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = "FakeGPS"
include ':app'

// Shared Environment Control contract v1. Lives outside this Gradle root
// because CellRebel Auto consumes the same module from its own independent root.
include ':environment-control-v1'
project(':environment-control-v1').projectDir =
        file('../../contracts/environment-control-v1')
