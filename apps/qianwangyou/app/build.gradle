plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'name.caiyao.fakegps'
    compileSdk 35

    defaultConfig {
        applicationId "name.caiyao.fakegps"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: '@string/app_name']
    }

    signingConfigs {
        // BOTH build types sign with the SAME repo-committed key, on purpose.
        //
        // This is a personal instrumentation module, never distributed through a store, so key
        // secrecy buys nothing here. What sharing one stable key does buy is real: debug and
        // release can replace each other via `adb install -r` without an uninstall. An uninstall
        // wipes /data/data, i.e. every profile the user configured — which has already cost us
        // one full loss of the user's saved profiles. One key, no data loss when switching builds.
        //
        // F-18 (2026-08-25): this used to point at the machine-local
        // ~/.android/debug.keystore, which made the signer ENVIRONMENT state, not repo state.
        // CI runners roll a fresh random debug.keystore per run; one such random-signed artifact
        // (run 32763136108, commit d3008ea) was installed on device ZY22JHW9M4, after which every
        // local `adb install -r` failed with INSTALL_FAILED_UPDATE_INCOMPATIBLE while
        // versionCode/versionName stayed identical — acceptance read the stale package as the
        // new build and ran false-green (sealed evidence: c5-evidence/f18-signer-divergence/).
        // The committed bytes ARE the machine key the device already trusts
        // (cert sha256 7a598cbe6fb816ba74f01b58e3f43b8ff0f463989157e590ebd86c89b53f7e41),
        // so install -r continuity holds for every existing device package.
        // scripts/check-debug-signer.sh guards built artifacts against signer regressions.
        bench {
            storeFile rootProject.file('keystores/bench.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bench
            // Bench variant: installs as a SEPARATE app alongside the release (production) build.
            // Release = "name.caiyao.fakegps" (千网游), stays on the phone untouched.
            // Debug  = "name.caiyao.fakegps.bench" (千网游·测试), independent installation.
            //
            // This lets us develop and test without ever disturbing the production module or its
            // saved profiles. The Xposed framework sees them as two distinct modules.
            applicationIdSuffix ".bench"
        }
        codexBench {
            initWith debug
            // Explicit isolated installation; never replace the ordinary bench app.
            applicationIdSuffix ".codexbench"
            manifestPlaceholders = [appLabel: '千网游 · codex-bench']
            matchingFallbacks = ['debug']
        }
        release {
            signingConfig signingConfigs.bench
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
        // Private system_server continuity bridge (separate from frozen Environment Control v1).
        aidl = true
        // Required so the hook/UI can compile out debug-only behaviour (self-hooking as a test
        // probe, verbose [DIAG] logging) instead of shipping it. AGP 8 defaults this off.
        buildConfig = true
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
        // Reuse the existing debug probes without moving them into release sources.
        codexBench.setRoot('src/debug')
    }
}

configurations.codexBenchImplementation.extendsFrom(configurations.debugImplementation)

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // Environment Control contract v1 (shared, frozen).
    implementation project(':environment-control-v1')

    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2025.04.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Activity + Navigation + Lifecycle
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'

    // Room
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    // Serialization (for type-safe Navigation routes)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    // AndroidX (kept for legacy Java code)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'

    // Map
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Official FLP mock-mode API used by Google Maps; authorized for Issue #12.
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    // Xposed
    compileOnly 'de.robv.android.xposed:api:82'

    // Unit testing — config channel contract (Phase A, JVM-only, no device needed)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.1'
}
